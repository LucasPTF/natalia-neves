<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Natália Neves | Versões da página</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f0e8; color: #213247; }
    main { width: min(720px, 100%); padding: clamp(28px, 6vw, 56px); border: 1px solid #dcd9d0; border-radius: 28px; background: #fff; box-shadow: 0 24px 80px rgb(33 50 71 / 10%); }
    p { color: #5d6670; line-height: 1.6; }
    nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 28px; }
    a { padding: 16px; border-radius: 14px; background: #2d5b50; color: white; font-weight: 750; text-align: center; text-decoration: none; }
    a:hover, a:focus-visible { background: #213247; }
    @media (max-width: 540px) { nav { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <p>Natália Neves</p>
    <h1>Versões da landing page</h1>
    <p>Escolha uma das três abordagens de hero para conferir a página completa.</p>
    <nav aria-label="Versões disponíveis">
      <a href="a1/">Versão A1</a>
      <a href="a2/">Versão A2</a>
      <a href="a3/">Versão A3</a>
    </nav>
  </main>
</body>
</html>
